name: Windows build

# Builds the harness from source on GitHub-hosted Windows runners: the Web
# bundle, and the Electron Desktop installer that mirrors the official
# Windows release. The upstream packaging workflow targets a retained runner
# with an EV signing token and machine presets, so this workflow packages an
# unsigned installer with no repository configuration; signing and
# publication stay with that workflow.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

# Cancel a superseded run on a new push, as in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build Web bundle
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build native addon, host, client, and Web artifacts
        run: pnpm run build:artifacts

      - name: Type-check aggregate test and script programs
        run: pnpm run build:check

      - name: Smoke-test the built CLI
        run: node apps/cli/lib/bin.js --help

      - name: Smoke-test the built Web bundle
        run: |
          $index = 'apps/web/dist/index.html'
          if (-not (Test-Path $index)) { throw "missing $index" }
          $html = Get-Content $index -Raw
          if ($html -notmatch '<div id="root"') { throw 'Web bundle has no root element' }

      - name: Upload Web bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-web-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Package Desktop installer
    # Packaging rebuilds the whole repository and downloads the Electron,
    # Node and Python runtimes, so pull requests keep to the Web job and run
    # this one manually from Actions when an installer is needed.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      # Packaging reads release settings from the ignored local dotenv, never
      # from the shell, so the step below writes it from these values.
      DESKTOP_PACKAGE_APP_ID: com.deepseek.dsh
      # Anonymous production policy: test deployment would require Feishu login
      # origins. The placeholder origin answers no policy, which leaves updates
      # available but never mandatory; set the repository variable to a real
      # service origin to enforce policy in fork builds.
      DESKTOP_PACKAGE_POLICY_ORIGIN: ${{ vars.DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN || 'https://example.com' }}
      # Installer archive compression: 3 packages faster, 7 packages smaller.
      DESKTOP_PACKAGE_COMPRESSION_LEVEL: '3'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Write packaging settings
        run: |
          $dotenv = @(
            "DSH_DESKTOP_APP_ID=$env:DESKTOP_PACKAGE_APP_ID"
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            "DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=$env:DESKTOP_PACKAGE_POLICY_ORIGIN"
            "DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=$env:DESKTOP_PACKAGE_COMPRESSION_LEVEL"
          ) -join "`n"
          Set-Content -LiteralPath 'apps/desktop/.env.windows' -Value $dotenv -NoNewline -Encoding utf8

      - name: Check packaging configuration and toolchain
        run: pnpm run package:desktop:win:x64:unsigned --check

      - name: Build installer and verify the packaged runtime
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-desktop-win-x64-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-desktop-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
